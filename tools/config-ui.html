<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFU-QK · 公选课配置器</title>
<style>
:root{
  --bg:#08090c;
  --panel:rgba(255,255,255,.032);
  --panel-hi:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.078);
  --line-hi:rgba(255,255,255,.13);
  --text:#e9ecf2;
  --dim:#878f9d;
  --faint:#565d6b;
  --accent:#7aa2ff;
  --green:#3ddc97;
  --amber:#f2b544;
  --violet:#b98bff;
  --danger:#ff6b6b;
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--text);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(820px 460px at 12% -8%, rgba(122,162,255,.10), transparent 62%),
    radial-gradient(680px 380px at 96% -4%, rgba(185,139,255,.075), transparent 58%),
    var(--bg);
  background-attachment:fixed;
  /* 桌面端是"应用"而不是长页面：两栏各自滚动，外框不滚 */
  display:flex;flex-direction:column;overflow:hidden;
}
::selection{background:rgba(122,162,255,.30)}
code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.92em}

/* 滚动条 */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:6px;border:3px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18);background-clip:padding-box}

/* ── 顶栏 ───────────────────────────────────── */
.topbar{
  flex:none;z-index:40;
  display:flex;align-items:center;gap:28px;flex-wrap:wrap;
  padding:16px 28px;
  background:rgba(8,9,12,.72);
  backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{
  width:36px;height:36px;border-radius:11px;flex:none;
  display:grid;place-items:center;
  font-size:11px;font-weight:700;letter-spacing:.5px;
  color:#0a0d14;
  background:linear-gradient(145deg,var(--accent),var(--violet));
  box-shadow:0 4px 16px -4px rgba(122,162,255,.6);
}
.titles h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.titles p{margin:1px 0 0;font-size:12px;color:var(--faint)}

.meters{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.meter{
  min-width:126px;padding:7px 11px 8px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel);
  cursor:pointer;transition:border-color .16s,background .16s,transform .16s;
}
.meter:hover{border-color:var(--line-hi);background:var(--panel-hi);transform:translateY(-1px)}
.meter .top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.meter .dot{width:5px;height:5px;border-radius:50%;background:var(--c);flex:none}
.meter .lbl{font-size:11.5px;color:var(--dim);white-space:nowrap}
.meter .num{
  margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;color:var(--faint);
  white-space:nowrap;
}
.meter.done .num{color:var(--c)}
.meter.lack{border-color:rgba(242,181,68,.35);background:rgba(242,181,68,.05)}
.meter.lack .num{color:var(--amber)}
.bar{height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:2px;background:var(--c);transition:width .35s cubic-bezier(.4,0,.2,1)}
.meter.done .lbl{color:var(--text)}

/* ── 布局 ───────────────────────────────────── */
.layout{
  flex:1;min-height:0;
  display:grid;grid-template-columns:minmax(330px,.86fr) minmax(440px,1.14fr);
  gap:18px;width:100%;max-width:1460px;margin:0 auto;padding:18px 28px;
  align-items:stretch;
}

.panel{
  position:relative;
  border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel);
  overflow:hidden;
  display:flex;flex-direction:column;min-height:0;
}
.panel-head{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:14px 16px 12px;
  border-bottom:1px solid var(--line);
}
.panel-head h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.01em}
.panel-head .count{
  font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;
  padding:1px 7px;border-radius:999px;border:1px solid var(--line);
}
.panel-head .spacer{flex:1}

/* ── 搜索与筛选 ─────────────────────────────── */
.filters{flex:none;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.search{
  position:relative;display:flex;align-items:center;
}
.search svg{position:absolute;left:11px;width:14px;height:14px;stroke:var(--faint);pointer-events:none}
.search input{
  width:100%;padding:9px 12px 9px 33px;
  background:rgba(255,255,255,.035);border:1px solid var(--line);
  border-radius:9px;color:var(--text);font:inherit;font-size:13px;outline:none;
  transition:border-color .16s,background .16s;
}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:rgba(122,162,255,.55);background:rgba(122,162,255,.05)}
.search .clr{
  position:absolute;right:8px;width:20px;height:20px;border:0;border-radius:6px;
  background:transparent;color:var(--faint);cursor:pointer;display:none;place-items:center;font-size:14px;
}
.search input:not(:placeholder-shown)+.clr{display:grid}
.search .clr:hover{color:var(--text);background:rgba(255,255,255,.07)}

.chips{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 9px;border-radius:7px;cursor:pointer;user-select:none;
  border:1px solid var(--line);background:transparent;
  font:inherit;font-size:11.5px;color:var(--dim);white-space:nowrap;
  transition:.14s;
}
.chip:hover{border-color:var(--line-hi);color:var(--text)}
.chip.on{
  background:rgba(122,162,255,.12);border-color:rgba(122,162,255,.45);color:#c9d9ff;
}
.chip .n{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.chip.on .n{color:rgba(201,217,255,.7)}
.chip .d{width:5px;height:5px;border-radius:50%;background:var(--c,transparent)}

/* ── 课程池 ─────────────────────────────────── */
.pool{
  flex:1;min-height:0;overflow-y:auto;
  padding:8px 8px 34px;
  overscroll-behavior:contain;
}

.course{
  position:relative;display:flex;align-items:center;gap:10px;
  padding:7px 10px 7px 13px;border-radius:8px;cursor:pointer;
  transition:background .13s;
}
.course+.course{margin-top:1px}
.course::before{
  content:"";position:absolute;left:3px;top:50%;transform:translateY(-50%);
  width:2px;height:16px;border-radius:2px;background:var(--c);opacity:.45;
  transition:height .18s cubic-bezier(.4,0,.2,1),opacity .18s;
}
.course:hover{background:rgba(255,255,255,.045)}
.course:hover::before{height:22px;opacity:1}
.course.in{background:rgba(122,162,255,.055)}
.course.in::before{background:var(--accent);opacity:.75}
.course.muted{opacity:.5}

.course .body{min-width:0;flex:1}
.course .nm{
  font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:7px;
}
.course .nm b{font-weight:400;overflow:hidden;text-overflow:ellipsis}
.course.muted .nm b{color:var(--dim)}
.course .sub{
  margin-top:1px;font-size:11px;color:var(--faint);
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.course .sub .sep{color:rgba(255,255,255,.14)}
.course .tag{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;color:var(--dim);
}
.course .tag .d{width:5px;height:5px;border-radius:50%;background:var(--c);flex:none}
.cr{
  flex:none;font-size:11px;font-variant-numeric:tabular-nums;
  color:var(--dim);padding:1px 6px;border-radius:5px;
  background:rgba(255,255,255,.05);
}
.addbtn{
  flex:none;width:26px;height:26px;border-radius:8px;
  border:1px solid var(--line-hi);background:transparent;color:var(--faint);
  cursor:pointer;display:grid;place-items:center;
  opacity:.3;transition:.14s;
}
.addbtn svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.2;fill:none}
.course:hover .addbtn{opacity:1}
.addbtn:hover{background:var(--accent);border-color:var(--accent);color:#08090c}
.badge{
  flex:none;width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(122,162,255,.14);color:#a9c3ff;
}
.badge svg{width:11px;height:11px;stroke:currentColor;stroke-width:2.4;fill:none}
.empty{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:40px 16px;color:var(--faint);font-size:12.5px;text-align:center;
}

/* ── 方案面板 ───────────────────────────────── */
.plan{padding:0}
.plan-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:34px}

.bkt{
  margin:10px 10px 0;padding:12px 13px 10px;
  border-radius:11px;border:1px solid var(--line);
  background:rgba(255,255,255,.022);
}
.bkt:last-child{margin-bottom:10px}
.bkt-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bkt-head .dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.bkt-head h3{margin:0;font-size:13px;font-weight:600}
.bkt-head .st{margin-left:auto;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--amber);flex:none}
.bkt-head .st.ok{color:var(--c);opacity:.72}

.bkt-meta{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.bkt-meta .rule{
  font-size:11px;color:var(--dim);opacity:.72;min-width:0;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.bkt-meta .cnt{font-size:11px;color:var(--faint);flex:none}
.stepper{
  display:flex;align-items:center;flex:none;
  border:1px solid var(--line);border-radius:7px;overflow:hidden;
  background:rgba(255,255,255,.03);
}
.stepper button{
  width:19px;height:21px;border:0;background:transparent;color:var(--faint);
  cursor:pointer;font-size:12px;line-height:1;padding:0;transition:.12s;
}
.stepper button:hover{background:rgba(255,255,255,.08);color:var(--text)}
.stepper .v{
  min-width:38px;text-align:center;font-size:10.5px;color:var(--faint);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.stepper .v b{color:var(--text);font-weight:500}

.slots{min-height:44px;border-radius:10px;transition:background .14s}
.slots.drop{background:rgba(122,162,255,.07);outline:1px dashed rgba(122,162,255,.35);outline-offset:2px}

.slot{
  display:flex;align-items:center;gap:9px;
  padding:7px 9px;border-radius:9px;cursor:grab;
  background:rgba(255,255,255,.032);
  border:1px solid transparent;
  transition:background .13s,border-color .13s,opacity .13s;
}
.slot button{cursor:pointer}
.slot+.slot{margin-top:3px}
.slot:hover{background:rgba(255,255,255,.06);border-color:var(--line)}
.slot.dragging{opacity:.35}
.slot.drop-target{border-color:rgba(122,162,255,.6);background:rgba(122,162,255,.1)}

.slot .grip{
  flex:none;width:14px;cursor:grab;color:var(--faint);
  display:flex;align-items:center;justify-content:center;
}
.slot .grip:active{cursor:grabbing}
.slot .grip svg{width:10px;height:14px;fill:currentColor;opacity:.55}
.slot:hover .grip svg{opacity:1}

.slot .idx{
  flex:none;width:18px;text-align:center;font-size:11px;
  color:var(--faint);font-variant-numeric:tabular-nums;
}
.slot .body{flex:1;min-width:0}
.slot .nm{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .sub{font-size:11px;color:var(--faint);margin-top:1px;display:flex;gap:6px;align-items:center}
.slot .warn{color:var(--amber);font-size:10.5px}
.slot .del{
  flex:none;width:22px;height:22px;border-radius:6px;border:0;background:transparent;
  color:var(--faint);cursor:pointer;opacity:0;transition:.13s;
  display:grid;place-items:center;
}
.slot .del svg{width:11px;height:11px;stroke:currentColor;stroke-width:2;fill:none}
.slot:hover .del{opacity:1}
.slot .del:hover{background:rgba(255,107,107,.14);color:var(--danger)}

.no-slot{
  padding:11px 12px;border-radius:9px;text-align:center;
  font-size:11.5px;color:var(--faint);
  border:1px dashed var(--line);
}
.more{
  flex:none;padding:2px 7px;border:0;border-radius:5px;background:transparent;
  color:var(--faint);font:inherit;font-size:11px;cursor:pointer;
  white-space:nowrap;transition:.13s;
}
.more:hover{background:rgba(255,255,255,.07);color:var(--dim)}

/* ── 底部 dock ──────────────────────────────── */
.dock{
  flex:none;z-index:50;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:11px 28px;
  background:rgba(8,9,12,.82);
  backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-top:1px solid var(--line);
}
@media (max-width:980px){.dock{padding:10px 16px;gap:10px}}

.switch{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch .track{
  width:34px;height:19px;border-radius:999px;flex:none;
  background:rgba(255,255,255,.10);position:relative;transition:.18s;
}
.switch .track::after{
  content:"";position:absolute;top:2.5px;left:2.5px;
  width:14px;height:14px;border-radius:50%;background:#fff;
  transition:.18s cubic-bezier(.4,0,.2,1);
}
.switch input:checked+.track{background:var(--green)}
.switch input:checked+.track::after{transform:translateX(15px)}
.switch .txt{font-size:12.5px;color:var(--text);white-space:nowrap}

.field{display:flex;align-items:center;gap:8px}
.field label{font-size:11.5px;color:var(--faint);flex:none}
.field input{
  width:196px;padding:6px 10px;border-radius:8px;
  border:1px solid var(--line);background:rgba(255,255,255,.035);
  color:var(--text);font:inherit;font-size:12px;
  font-family:ui-monospace,Consolas,monospace;outline:none;
  transition:border-color .16s;
}
.field input:focus{border-color:rgba(122,162,255,.55)}
.dock-hint{font-size:11.5px;color:var(--faint)}
.dock-hint code{color:var(--dim);font-size:11px}
@media (max-width:1180px){.dock-hint{display:none}}

.btn{
  padding:7px 14px;border-radius:9px;font:inherit;font-size:12.5px;
  border:1px solid var(--line-hi);background:rgba(255,255,255,.045);
  color:var(--text);cursor:pointer;transition:.15s;white-space:nowrap;
}
.btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.2)}
.btn:active{transform:translateY(.5px)}
.btn.primary{
  background:linear-gradient(140deg,var(--accent),#6d8dff);
  border-color:transparent;color:#070a10;font-weight:600;
  box-shadow:0 4px 18px -6px rgba(122,162,255,.7);
}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:7px;color:var(--dim)}
.btn.sm:hover{color:var(--text)}

/* ── 弹层 ───────────────────────────────────── */
.modal{
  position:fixed;inset:0;z-index:80;display:none;
  align-items:center;justify-content:center;padding:24px;
  background:rgba(0,0,0,.62);backdrop-filter:blur(6px);
}
.modal.show{display:flex}
.modal .box{
  width:min(720px,100%);max-height:82vh;display:flex;flex-direction:column;
  background:#0d0f14;border:1px solid var(--line-hi);border-radius:16px;
  box-shadow:0 24px 80px -20px rgba(0,0,0,.9);
  overflow:hidden;
  animation:pop .18s cubic-bezier(.2,.8,.3,1);
}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.modal .box header{
  display:flex;align-items:center;gap:10px;padding:13px 16px;
  border-bottom:1px solid var(--line);font-size:13px;font-weight:600;
}
.modal .box header .spacer{flex:1}
.modal pre{
  margin:0;padding:16px;overflow:auto;font-size:11.5px;line-height:1.65;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  color:#a9b4c6;flex:1;
}
.modal .x{
  width:26px;height:26px;border-radius:7px;border:0;background:transparent;
  color:var(--faint);cursor:pointer;display:grid;place-items:center;font-size:16px;
}
.modal .x:hover{background:rgba(255,255,255,.08);color:var(--text)}

/* toast */
.toast{
  position:fixed;left:50%;bottom:74px;transform:translate(-50%,10px);
  padding:9px 16px;border-radius:10px;font-size:12.5px;
  background:rgba(30,34,44,.96);border:1px solid var(--line-hi);
  color:var(--text);box-shadow:0 12px 40px -12px rgba(0,0,0,.8);
  opacity:0;pointer-events:none;transition:.22s;z-index:90;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ── 窄屏：退回普通长页面 ───────────────────── */
@media (max-width:980px){
  body{display:block;overflow:auto;height:auto}
  .topbar{padding:14px 16px;gap:14px}
  .meters{width:100%;margin-left:0}
  .meter{flex:1;min-width:0}
  .layout{
    display:block;height:auto;padding:14px 16px 90px;
  }
  .panel{display:block;overflow:visible}
  .panel+.panel{margin-top:14px}
  .pool{max-height:none;overflow:visible}
  .plan-body{overflow:visible}
  .dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px;gap:10px}
  .field input{width:150px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="mark">NFU</div>
    <div class="titles">
      <h1>公选课配置器</h1>
      <p>南京林业大学 · 2026 秋季学期 · 仅含开课学期带「秋」的课程</p>
    </div>
  </div>
  <div class="meters" id="meters"></div>
</header>

<main class="layout">
  <section class="panel">
    <div class="panel-head">
      <h2>课程库</h2>
      <span class="count" id="poolCount">0</span>
      <div class="spacer"></div>
      <button class="btn sm" id="btnHint">怎么用</button>
    </div>
    <div class="filters">
      <div class="search">
        <svg viewBox="0 0 16 16" fill="none" stroke-width="1.8"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14" stroke-linecap="round"/></svg>
        <input id="search" type="text" placeholder="搜索课程名、代码、学院…" autocomplete="off">
        <button class="clr" id="btnClearSearch" title="清空">✕</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="pool" id="pool"></div>
  </section>

  <section class="panel plan">
    <div class="panel-head">
      <h2>我的方案</h2>
      <span class="count" id="planCount">0 门</span>
      <div class="spacer"></div>
      <button class="btn sm" id="btnReset">重置推荐</button>
      <button class="btn sm" id="btnClearAll">清空</button>
    </div>
    <div id="buckets" class="plan-body"></div>
  </section>
</main>

<div class="dock">
  <label class="switch" title="打开时只做匹配与凭证获取，不会真的提交选课">
    <input type="checkbox" id="dry" checked>
    <span class="track"></span>
    <span class="txt">干跑</span>
  </label>
  <div class="field">
    <label>开抢时间</label>
    <input id="startAt" type="text" value="2026-11-03T12:30:00+08:00" spellcheck="false">
  </div>
  <div class="dock-hint">下载后放项目根目录，跑 <code>node src/cli.js run --config config.ggxxk.json</code></div>
  <div style="flex:1"></div>
  <button class="btn" id="btnPreview">预览配置</button>
  <button class="btn primary" id="btnSave">保存配置文件</button>
</div>

<div class="modal" id="modal">
  <div class="box">
    <header>
      <span id="modalTitle">配置预览</span>
      <div class="spacer"></div>
      <button class="x" id="modalClose">✕</button>
    </header>
    <pre id="modalBody"></pre>
  </div>

    accepts: c => c.unit === '创新创业' },
  { id:'art', label:'艺术审美', need:2, color:'#b98bff',
    rule:'课程单元 = 美学和艺术史论类 或 艺术鉴赏和评论类',
    accepts: c => c.unit === '艺术审美（美学和艺术史论类）' || c.unit === '艺术审美（艺术鉴赏和评论类）' },
];
const BK_BY_ID = new Map(BUCKETS.map(b => [b.id, b]));

const INITIAL = (() => {
  try { return JSON.parse(document.getElementById('initialChains').textContent); }
  catch { return { green:[], innov:[], art:[] }; }
})();

const state = {
  earned: { green:0, innov:0, art:0 },
  chains: { green:[], innov:[], art:[] },
  filter: 'all',      // all | green | innov | art | other
  q: '',
  expanded: { green:false, innov:false, art:false },
};

// 候选链默认只展开前几门：三个类别要一眼能同时看到，
// 二十几门全铺开会把后面的类别挤到屏幕外。
const COLLAPSE_AT = 3;
for (const b of BUCKETS) state.chains[b.id] = [...(INITIAL[b.id] || [])];

// ── 工具 ────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const bucketOf = c => BUCKETS.find(b => b.accepts(c)) || null;
const creditsOf = code => byCode.get(code)?.credits || 0;
const chainCredits = bid => state.chains[bid].reduce((s, c) => s + creditsOf(c), 0);
const compact = n => n >= 10000 ? (n/10000).toFixed(1)+'万' : String(n);

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

// ── 顶部指标 ────────────────────────────────────────────────
function renderMeters(){
  $('#meters').innerHTML = BUCKETS.map(b => {
    const got = state.earned[b.id] || 0;
    const need = Math.max(0, b.need - got);
    const planned = chainCredits(b.id);
    const n = state.chains[b.id].length;
    const ready = need === 0 || planned >= need;
    const pct = need === 0 ? 100 : Math.min(100, planned / need * 100);
    const txt = need === 0 ? '已修满' : ready ? `${n} 门` : `缺 ${need - planned} 分`;
    const cls = ready ? ' done' : ' lack';
    return `<div class="meter${cls}" data-jump="${b.id}" style="--c:${b.color}" title="${b.label}：需 ${need} 学分，候选 ${n} 门共 ${planned} 学分">
      <div class="top">
        <span class="dot"></span>
        <span class="lbl">${b.label}</span>
        <span class="num">${txt}</span>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>`;
  }).join('');
  $('#meters').querySelectorAll('[data-jump]').forEach(el => {
    el.onclick = () => {
      const t = document.querySelector(`[data-bkt="${el.dataset.jump}"]`);
      if (t) t.scrollIntoView({ behavior:'smooth', block:'center' });
    };
  });
}

// ── 课程库 ──────────────────────────────────────────────────
const FILTERS = [
  { id:'all',   label:'全部' },
  { id:'green', label:'绿色文明', color:'#3ddc97', test: c => c.category === '绿色文明' },
  { id:'innov', label:'创新创业', color:'#f2b544', test: c => c.unit === '创新创业' },
  { id:'art',   label:'艺术审美', color:'#b98bff', test: c => BUCKETS[2].accepts(c) },
  { id:'other', label:'不计学分' },
];

function poolPool(){
  const f = FILTERS.find(x => x.id === state.filter) || FILTERS[0];
  const q = state.q.toLowerCase();
  return COURSES.filter(c => {
    if (f.test) { if (!f.test(c)) return false; }
    else if (f.id === 'all') { if (!bucketOf(c)) return false; }
    else if (f.id === 'other') { if (bucketOf(c)) return false; }
    if (!q) return true;
    return [c.name, c.code, c.category, c.unit, c.dept, c.nameEn].join(' ').toLowerCase().includes(q);
  });
}

function renderChips(){
  const base = COURSES;
  const counts = {
    all: base.filter(c => bucketOf(c)).length,
    green: base.filter(c => c.category === '绿色文明').length,
    innov: base.filter(c => c.unit === '创新创业').length,
    art: base.filter(c => BUCKETS[2].accepts(c)).length,
    other: base.filter(c => !bucketOf(c)).length,
  };
  $('#chips').innerHTML = FILTERS.map(f => {
    const on = state.filter === f.id ? ' on' : '';
    const dot = f.color ? `<span class="d" style="--c:${f.color}"></span>` : '';
    return `<button class="chip${on}" data-f="${f.id}" ${f.color ? `style="--c:${f.color}"` : ''}>
      ${dot}${f.label}<span class="n">${counts[f.id]}</span>
    </button>`;
  }).join('');
  $('#chips').querySelectorAll('[data-f]').forEach(el => {
    el.onclick = () => { state.filter = el.dataset.f; renderChips(); renderPool(); };
  });
}

// 某门课当前被放进了哪个桶（用于显示序号 / 已选态）
function placement(code){
  for (const b of BUCKETS) {
    const i = state.chains[b.id].indexOf(code);
    if (i >= 0) return { b, i };
  }
  return null;
}

function renderPool(){
  const list = poolPool();
  $('#poolCount').textContent = list.length + ' 门';

  if (!list.length) {
    $('#pool').innerHTML = `<div class="empty">
      <div>没有匹配的课程</div>
      <div style="font-size:11.5px">试试换个关键词，或切到「其他」看看不属于目标的课</div>
    </div>`;
    return;
  }

  const shown = list.slice(0, 300);
  $('#pool').innerHTML = shown.map(c => {
    const b = bucketOf(c);
    const put = placement(c.code);
    const color = b ? b.color : 'rgba(255,255,255,.2)';
    const tag = b
      ? `<span class="tag" style="--c:${b.color}"><span class="d"></span>${b.label}</span>`
      : `<span class="tag" style="--c:rgba(255,255,255,.25)"><span class="d"></span>不计学分</span>`;
    return `<div class="course${put ? ' in' : ''}${b ? '' : ' muted'}" data-code="${c.code}" style="--c:${color}">
      <div class="body">
        <div class="nm"><b title="${esc(c.name)}">${esc(c.name)}</b></div>
        <div class="sub">
          <span class="code">${esc(c.code)}</span>
          <span class="sep">·</span>
          ${tag}
          <span class="sep">·</span>
          <span>${esc(c.dept || '')}</span>
        </div>
      </div>
      <span class="cr">${c.credits} 分</span>
      ${put
        ? `<span class="badge" title="已在「${put.b.label}」候选第 ${put.i+1} 位，点击移出"><svg viewBox="0 0 12 12"><path d="M2 6.3l2.6 2.6L10 3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`
        : `<button class="addbtn" data-add="${c.code}" title="加入方案">
             <svg viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke-linecap="round"/></svg>
           </button>`}
    </div>`;
  }).join('');
}

// 左栏点击：交给事件冒泡处理
$('#pool').addEventListener('click', e => {
  const btn = e.target.closest('[data-add]');
  const row = e.target.closest('[data-code]');
  const code = btn ? btn.dataset.add : row?.dataset.code;
  if (!code) return;
  const c = byCode.get(code);
  if (!c) return;

  const put = placement(code);
  if (put) {  // 已在方案里 → 移除（点击即切换，符合直觉）
    state.chains[put.b.id].splice(put.i, 1);
    toast(`已从「${put.b.label}」移除 ${c.name}`);
  } else {
    const b = bucketOf(c);
    if (!b) {
      const pick = askBucket(c);
      if (!pick) return;
      state.chains[pick].push(code);
      toast(`已加入「${BK_BY_ID.get(pick).label}」——注意这门课不算该类学分`);
    } else {
      state.chains[b.id].push(code);
      toast(`已加入「${b.label}」：${c.name}`);
    }
  }
  render();
});

// 不属于任何目标类别的课：强制加入时让用户选桶
function askBucket(c){
  const names = BUCKETS.map((b, i) => `${i+1}. ${b.label}`).join('\n');
  const pick = prompt(`「${c.name}」不属于任何目标类别。\n强行加入只能占用候选位、抢到也不算该类学分。\n\n加入哪个类别？\n${names}\n\n输入 1-3，取消则不加入。`);
  const i = Number(pick) - 1;
  return Number.isInteger(i) && i >= 0 && i < BUCKETS.length ? BUCKETS[i].id : null;
}

// ── 方案面板 ────────────────────────────────────────────────
function renderBuckets(){
  $('#buckets').innerHTML = BUCKETS.map(b => {
    const chain = state.chains[b.id];
    const got = state.earned[b.id] || 0;
    const need = Math.max(0, b.need - got);
    const planned = chainCredits(b.id);
    const done = need === 0 || planned >= need;
    const pct = need === 0 ? 100 : Math.min(100, planned / need * 100);
    const shortfall = Math.max(0, need - planned);
    const expanded = Boolean(state.expanded[b.id]);
    const visible = expanded ? chain : chain.slice(0, COLLAPSE_AT);
    const hidden = chain.length - visible.length;

    const slots = visible.map((code, i) => {
      const c = byCode.get(code) || { name:'(未知课程)', credits:0, unit:'', code };
      const wrong = !b.accepts(c);
      return `<div class="slot" draggable="true" data-b="${b.id}" data-i="${i}" data-code="${esc(code)}">
        <span class="grip" title="拖动排序">
          <svg viewBox="0 0 10 14"><circle cx="2" cy="2" r="1.2"/><circle cx="8" cy="2" r="1.2"/><circle cx="2" cy="7" r="1.2"/><circle cx="8" cy="7" r="1.2"/><circle cx="2" cy="12" r="1.2"/><circle cx="8" cy="12" r="1.2"/></svg>
        </span>
        <span class="idx">${i+1}</span>
        <div class="body">
          <div class="nm" title="${esc(c.name)}">${esc(c.name)}</div>
          <div class="sub">
            <span class="code">${esc(c.code)}</span>
            <span>${c.credits} 分</span>
            ${wrong ? '<span class="warn">⚠ 不属于该类</span>' : ''}
          </div>
        </div>
        <button class="del" data-del="${b.id}" data-i="${i}" title="移出">
          <svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke-linecap="round"/></svg>
        </button>
      </div>`;
    }).join('');

    return `<div class="bkt" data-bkt="${b.id}" style="--c:${b.color}">
      <div class="bkt-head">
        <span class="dot"></span>
        <h3>${b.label}</h3>
        <span class="st${done ? ' ok' : ''}">${done ? '✔ 已满足' : `还差 ${shortfall} 分`}</span>
      </div>
      <div class="bkt-meta">
        <span class="rule" title="${b.rule}">${b.rule}</span>
        ${hidden > 0 ? `<button class="more" data-more="${b.id}" title="展开全部 ${chain.length} 门备选">还有 ${hidden} 门</button>` : ''}
        ${expanded && chain.length > COLLAPSE_AT ? `<button class="more" data-more="${b.id}">收起</button>` : ''}
        <div class="stepper" title="该类已修学分 —— 程序只补差额">
          <button data-earned="${b.id}" data-d="-1">−</button>
          <span class="v">已修 <b>${got}</b></span>
          <button data-earned="${b.id}" data-d="1">+</button>
        </div>
      </div>
      <div class="slots" data-b="${b.id}">
        ${slots || `<div class="no-slot">还没有候选 —— 从左侧课程库点选加入</div>`}
      </div>
    </div>`;
  }).join('');

  $('#planCount').textContent = BUCKETS.reduce((s, b) => s + state.chains[b.id].length, 0) + ' 门';

  $('#buckets').querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = () => {
      state.chains[btn.dataset.del].splice(Number(btn.dataset.i), 1);
      render();
    };
  });
  $('#buckets').querySelectorAll('[data-earned]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.earned;
      const v = (state.earned[id] || 0) + Number(btn.dataset.d);
      state.earned[id] = Math.max(0, Math.min(10, v));
      render();
    };
  });
  $('#buckets').querySelectorAll('[data-more]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.more;
      state.expanded[id] = !state.expanded[id];
      render();
    };
  });
}

// ── 拖拽排序（同桶内 + 跨桶）────────────────────────────────
let drag = null;

$('#buckets').addEventListener('dragstart', e => {
  const slot = e.target.closest('.slot');
  if (!slot) return;
  drag = { b: slot.dataset.b, code: slot.dataset.code };
  slot.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', slot.dataset.code);
});
$('#buckets').addEventListener('dragend', () => {
  drag = null;
  $('#buckets').querySelectorAll('.dragging,.drop-target,.drop').forEach(n =>
    n.classList.remove('dragging','drop-target','drop'));
});
$('#buckets').addEventListener('dragover', e => {
  if (!drag) return;
  const slot = e.target.closest('.slot');
  const list = e.target.closest('.slots');
  if (!slot && !list) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  $('#buckets').querySelectorAll('.drop-target,.drop').forEach(n => n.classList.remove('drop-target','drop'));
  (slot || list).classList.add(slot ? 'drop-target' : 'drop');
});
$('#buckets').addEventListener('drop', e => {
  if (!drag) return;
  e.preventDefault();
  const slot = e.target.closest('.slot');
  const list = e.target.closest('.slots');
  const to = slot ? slot.dataset.b : list?.dataset.b;
  if (!to) return;
  if (slot && slot.dataset.code === drag.code) return;

  const src = state.chains[drag.b];
  const i = src.indexOf(drag.code);
  if (i >= 0) src.splice(i, 1);
  const dst = state.chains[to];
  if (slot) {
    const at = dst.indexOf(slot.dataset.code);
    dst.splice(at < 0 ? dst.length : at, 0, drag.code);
  } else {
    dst.push(drag.code);
  }
  drag = null;
  render();
});

// ── 预览 / 保存 ─────────────────────────────────────────────
function buildConfig(){
  const targets = [];
  const buckets = [];
  for (const b of BUCKETS) {
    const got = state.earned[b.id] || 0;
    const needCredits = Math.max(0, b.need - got);
    const ids = [];
    state.chains[b.id].forEach((code, i) => {
      const c = byCode.get(code) || {};
      const id = `${b.id}-${code}`;
      const codes = code.startsWith('C') ? [code, code.slice(1)] : [code];
      targets.push({ id, courseCode:{ exact: codes }, priority: i, credits: c.credits, _name: c.name });
      ids.push(id);
    });
    buckets.push({ id:b.id, label:b.label, rule:b.rule, needCredits, targets:ids });
  }
  return {
    profile: 'ggxxk-xsxkkc',
    school: 'NJFU',
    term: { xnm:'2026', xqm:'3' },
    auth: { entry:'ehall', username:'${NJFU_USER}', password:'${NJFU_PASS}',
            mode:'autofill', pauseOnCaptcha:true, sessionFile:'state/session.json' },
    _note: '由 tools/config-ui.html 生成。targets 里的 _name 只是注释，程序不读。',
    buckets,
    targets,
    strategy: { stopAfterSuccess:false, maxAttemptsPerTarget:0, fullFallbackAfterSec:0 },
    schedule: {
      startAt: $('#startAt').value.trim() || undefined,
      prewarmSec:120, highFreqBeforeSec:30, highFreqIntervalMs:400, intervalMs:2500, maxRunMinutes:120,
    },
    net: { proxy:null, concurrency:1, connectTimeoutMs:5000, readTimeoutMs:20000, maxRetries:6,
           maxRedirects:20, backoff:{ baseMs:1500, factor:1.6, maxMs:15000, jitter:0.3 },
           ipv4First:true, rejectUnauthorized:true },
    safety: { dryRun: $('#dry').checked, maxSubmitsPerMinute:6 },
  };
}

function openModal(title, body){
  $('#modalTitle').textContent = title;
  $('#modalBody').textContent = body;
  $('#modal').classList.add('show');
}

$('#btnPreview').onclick = () => openModal('配置预览', JSON.stringify(buildConfig(), null, 2));
$('#modalClose').onclick = () => $('#modal').classList.remove('show');
$('#modal').onclick = e => { if (e.target.id === 'modal') $('#modal').classList.remove('show'); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('#modal').classList.remove('show');
});

$('#btnSave').onclick = () => {
  const short = BUCKETS.filter(b => {
    const need = Math.max(0, b.need - (state.earned[b.id] || 0));
    return need > 0 && chainCredits(b.id) < need;
  });
  if (short.length && !confirm(
    `以下类别候选学分不够，抢到的可能性很低：\n\n` +
    short.map(b => `· ${b.label}：需要 ${b.need - (state.earned[b.id]||0)} 分，候选只排了 ${chainCredits(b.id)} 分`).join('\n') +
    `\n\n仍然保存吗？`)) return;

  const blob = new Blob([JSON.stringify(buildConfig(), null, 2) + '\n'], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'config.ggxxk.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('已保存 config.ggxxk.json —— 放到项目根目录');
};

// ── 其它控件 ────────────────────────────────────────────────
$('#search').addEventListener('input', e => { state.q = e.target.value.trim(); renderPool(); });
$('#btnClearSearch').onclick = () => { $('#search').value = ''; state.q = ''; renderPool(); $('#search').focus(); };

$('#btnReset').onclick = () => {
  for (const b of BUCKETS) state.chains[b.id] = [...(INITIAL[b.id] || [])];
  render();
  toast('已恢复推荐方案（全部候选，2 学分优先）');
};
$('#btnClearAll').onclick = () => {
  if (!confirm('清空三个类别的全部候选？')) return;
  for (const b of BUCKETS) state.chains[b.id] = [];
  render();
};

$('#btnHint').onclick = () => openModal('怎么用', HINT);

const HINT = `这个页面不连服务器，改完只会下载一个 config.ggxxk.json。

1. 左边是课程库（学校官方课表里开课学期带「秋」的 90 门）。
   点课程卡片即可加入方案；再点一次移出。
   卡片左边的色条表示它属于哪个类别，灰色的「不计学分」课需要手动指定类别。

2. 右边每个类别是一条「候选链」：
   程序按 1、2、3 的顺序往下试，前一门满员才试下一门。
   拖动可以调顺序，这决定了你最想上哪门。

3. 顶部「已修 / 需」和每个类别的「已修」步进器：
   如果你这个类别已经修够学分，把它调上去，程序会自动跳过该类，不再做无用功。

4. 保存后把 config.ggxxk.json 放到项目根目录，运行：
     node src/cli.js doctor --config config.ggxxk.json
     node src/cli.js run   --config config.ggxxk.json        # 干跑
     node src/cli.js run   --config config.ggxxk.json --live  # 实跑

注意：课程库没有容量、教师、上课时间，这些只有选课系统实时返回。
所以候选链排得越长，抢到概率越高——但抢到的课是真要上一学期的，
把不能接受的删掉。`;

// ── 启动 ────────────────────────────────────────────────────
function render(){ renderMeters(); renderPool(); renderBuckets(); }

renderChips();
render();
</script>
</body>
</html>
